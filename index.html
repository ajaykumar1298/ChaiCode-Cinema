<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar Seat Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");
      body {
        font-family: "Outfit", sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
     
      #logout-btn,
      #login-section #login-btn {
        display: none;
      }
     
      #logout-btn.active,
      #login-section #login-btn.active {
        display: block;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col items-center bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900"
  >
  <div class="flex felx-row bg-gray-900 p-4 w-full mb-12 items-center">
      <div id="login-section" class="flex felx-row gap-4 items-center  ">
        <button
          id="login-btn"
          class=" p-2  rounded-lg bg-green-600  shadow-lg "
        >
          login /signup
        </button>
        <button
          id="logout-btn"
          class="p-2  rounded-lg bg-gray-700 text-white shadow-lg bg-red-500 shadow-lg"
        >
          logout
        </button>
        <div id="user-name"></div>
      </div>
  </div>
    <div
      class="max-w-7xl w-full bg-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl p-10 border border-slate-700/50"
    >
    

      <div class="text-center mb-10">
        <h1
          class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-4 tracking-tight"
        >
          ChaiCode Cinema - Now Showing<br />
          <br />
          <span class="text-red-400">
            <span class="font-bold">Dhurandhar The Revenge</span>
          </span>
        </h1>
        <p class="text-slate-400 text-lg">Jassi ko ghar ki yaad kyu nhi aai?</p>
      </div>

      <div class="flex justify-center mb-10">
        <div
          class="bg-slate-900/50 rounded-full px-6 py-3 border border-slate-700 flex gap-8 items-center"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-4 h-4 rounded-full bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.6)]"
            ></div>
            <span class="text-slate-300 font-medium tracking-wide"
              >Available</span
            >
          </div>
          <div class="w-px h-6 bg-slate-700"></div>
          <div class="flex items-center gap-3">
            <div
              class="w-4 h-4 rounded-full bg-rose-500/20 border border-rose-500/50"
            ></div>
            <span class="text-slate-400 font-medium tracking-wide">Booked</span>
          </div>
        </div>
      </div>

      <div class="flex justify-center">
        <div
          class="bg-slate-900/40 p-8 rounded-2xl border border-slate-700/50 shadow-inner"
        >
          <div
            id="tbl"
            class="grid gap-3 grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8"
          ></div>
        </div>
      </div>
    </div>

    <script>
      let loginBtn = document.querySelector("#login-btn");
      let userInfo = document.querySelector("#user-name");
      let logoutBtn = document.querySelector("#logout-btn");

      // if (!isUser) {
      //   loginBtn?.classList.add("active");
      //   userInfo?.classList.remove("active");
      //   logoutBtn?.classList.remove("active");
      // } else {
      //   userInfo.innerHTML = `Welcom back <span class="text-green-300 text-bold text-lg">${isUser}</span>`;
      //   userInfo?.classList.add("active");
      //   loginBtn?.classList.remove("active");
      //   logoutBtn?.classList.add("active");
      // }
      async function init() {
        try {
          const res = await fetch("/getUser", {
            method:"GET"
          });

          const data = await res.json();

          if (!res.ok) {
          loginBtn.style.display = "block";
          logoutBtn.style.display = "none";
            // userInfo.style.display="none"
              userInfo.innerHTML =`<span class="text-green-300 text-bold text-lg">Guest User</span>`
          return
          }

          userInfo.innerHTML =`Welcom back <span class="text-green-300 text-bold text-lg">${data.data.username}</span>`
          // show logout
          loginBtn.style.display = "none";
          logoutBtn.style.display = "block";
          // userInfo.style.display="block"
        } catch (error) {
          userInfo.innerHTML =`<span class="text-green-300 text-bold text-lg">Guest User</span>`
          loginBtn.style.display = "block";
          logoutBtn.style.display = "none";
          // userInfo.style.display="none"
        }
      }
      init();
      loginBtn.addEventListener("click", () => {
        window.location = "/login";
      });

      logoutBtn.addEventListener("click", async () => {
        try {
          const res = await fetch("/auth/logout", {
            method: "POST",
            credentials: "include",
          });

          const data = await res.json();

          if (res.ok) {
            alert(data.msg + " ✅");
            window.location.href = "/login";
          }
        } catch (error) {
          console.log(error);
        }
      });
      async function run() {
        const tbl = document.getElementById("tbl");
        const res = await fetch("/seats");
        const resarray = await res.json();
        const j = resarray.sort((a, b) => a.id - b.id);

        // let tr;
        for (let i = 0; i < j.length; i++) {
          // if (i % 8 === 0) tr = document.createElement("tr");

          const td = document.createElement("div");

          // Base aesthetic classes - added 'relative group' for tooltip positioning
          const baseClasses =
            "w-full h-20 aspect-square rounded-xl flex items-center justify-center text-xs sm:text-sm md:text-lg font-bold transition-all duration-300 select-none relative group";

          if (j[i].isBooked) {
            td.className = `${baseClasses} bg-rose-500/10 text-rose-500/60 border border-rose-500/20 cursor-not-allowed`;
            td.innerHTML = `
                          <span class="relative z-10">${j[i].id}</span>
                          <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 px-4 py-2 bg-slate-900 border border-slate-700 text-sm text-slate-300 rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 whitespace-nowrap shadow-2xl z-50 pointer-events-none font-normal shadow-[0_10px_25px_rgba(0,0,0,0.5)]">
                              Booked by: <span class="font-bold text-white ml-1">${j[i].name}</span>
                              <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[1px] border-[6px] border-transparent border-t-slate-700"></div>
                              <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[2px] border-[5px] border-transparent border-t-slate-900"></div>
                          </div>
                      `;
          } else {
            td.className = `${baseClasses} bg-emerald-500 text-white border-2 border-emerald-400 shadow-[0_0_20px_rgba(16,185,129,0.3)] cursor-pointer hover:bg-emerald-400 hover:-translate-y-1.5 hover:shadow-[0_10px_25px_rgba(16,185,129,0.5)] active:scale-95 active:shadow-[0_0_10px_rgba(16,185,129,0.3)]`;
            td.innerHTML = `<span class="relative z-10">${j[i].id}</span>`;
          }

          td.addEventListener("click", async function (e) {
            const currentTd = e.currentTarget;
            if (currentTd.classList.contains("cursor-not-allowed")) {
              return; // Seat is already taken
            }

            try {
              const id = j[i].id; // Safe from loop closure
              
              const name = prompt("Enter your name");
              if (!name) return;

              const res = await fetch(`/${id}/${name}`, { method: "PUT" });
             
              
              if (res.status !== 200) {
                alert("please login first to book ticket!");
                return;
              }
              const data = await res.json();
              if (data.error) {
                alert("FAILED! Couldn't book! already booked.");
              } else {
                alert("Booked successfully!");
                // Visually transition to booked state upon success
                currentTd.className = `${baseClasses} bg-rose-500/10 text-rose-500/60 border border-rose-500/20 cursor-not-allowed`;
                currentTd.innerHTML = `
                                  <span class="relative z-10">${id}</span>
                                  <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 px-4 py-2 bg-slate-900 border border-slate-700 text-sm text-slate-300 rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 whitespace-nowrap shadow-2xl z-50 pointer-events-none font-normal shadow-[0_10px_25px_rgba(0,0,0,0.5)]">
                                      Booked by: <span class="font-bold text-white ml-1">${name}</span>
                                      <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[1px] border-[6px] border-transparent border-t-slate-700"></div>
                                      <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[2px] border-[5px] border-transparent border-t-slate-900"></div>
                                  </div>
                              `;
              }
            } catch (ex) {
              alert("error booking " + ex);
            }
          });
          // tr.appendChild(td);
          // tbl.appendChild(tr);
          tbl.appendChild(td);
        }
      }
      run();
    </script>
  </body>
</html>
