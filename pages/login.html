<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script >
      async function init() {
        try {
          const res = await fetch("/getUser", {
            method: "GET",
            credentials: "include",
          });

          if (res.ok) {
            window.location.href = "/";
            return;
          }
            document.body.style.display = "";
        } catch (error) {
              document.body.style.display = "";
          console.log(error);
        }
      }

      init();
    </script>
  </head>
  <body
  style="display: none;"
    class="bg-gray-900 flex flex-col items-center justify-center  gap-6 text-white"
  >
    <!-- app heading -->
    <h1 class="text-3xl md:text-4xl font-bold my-12">🎫 ChaiCode Cinema</h1>
    <!-- form container -->
    <div class="bg-gray-800 p-8 rounded-3xl shadow-lg w-full max-w-md">
      <h2 id="title" class="text-2xl font-bold text-center mb-6">login</h2>
      <form id="formField" class="space-y-4">
        <!-- name -->
        <div id="namefiled" style="display: none">
          <label class="text-gray-300 text-sm" for="username">Full Name</label>
          <input
            type="text"
            id="username"
            class="w-full mt-1 p-2 rounded-lg bg-gray-700"
            placeholder="Enter your full name"
          />
        </div>
        <!-- email -->
        <div>
          <label for="email" class="text-gray-300 text-sm">Email</label>
          <input
            type="email"
            id="email"
            class="w-full mt-1 p-2 rounded-lg bg-gray-700"
            placeholder="Enter your email"
            required
          />
        </div>
        <!-- password -->
        <div>
          <label for="password" class="text-gray-300 text-sm">Password</label>
          <input
            type="text"
            id="password"
            class="w-full mt-1 p-2 rounded-lg bg-gray-700"
            placeholder="Enter your password"
            required
          />
        </div>
        <!-- submit btn -->
        <div class="flex gap-3">
          <button id="submitBtn" class="w-full bg-green-600 py-2 rounded-lg">
            Login
          </button>
          <button id="skip" type="button" class="w-full bg-gray-600 py-2 rounded-lg">
            Skip
          </button>
        </div>

        <!-- toogle link -->
        <p class="text-gray-400 text-sm text-center">
          <span id="toogleText">Do not have an account?</span>
          <a href="#" id="ToogleLink" class="text-blue-500">Signup</a>
        </p>
      </form>
    </div>

    <script>
      // login and signup toggler handle

      let isLogin = true;
      document.querySelector("#ToogleLink").addEventListener("click", (e) => {
        isLogin = !isLogin;
        document.querySelector("#email").value = "";
        document.querySelector("#password").value = "";
        document.querySelector("#username").value = "";
        document.querySelector("#title").innerHTML = isLogin
          ? "Login"
          : "Create Account";
        document.querySelector("#submitBtn").innerHTML = isLogin
          ? "Login"
          : "Sign Up";
        document.querySelector("#toogleText").innerHTML = isLogin
          ? "Don't have an account?"
          : "Already have an account?";
        e.target.innerHTML = isLogin ? "Sign Up" : "Login";
        document.querySelector("#namefiled").style.display = isLogin
          ? "none"
          : "block";
      });

      // skip handle
      document.querySelector("#skip").addEventListener("click", (e) => {
        e.preventDefault()
        window.location.href = "/";
      });
      //   handle api
      async function handleAuth(url, body, successMsg, failMsg) {
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          const data = await res.json();
          if (res.ok) {
            alert(successMsg + " ✅");
            window.location.href = "/";
          } else {
            alert(`${failMsg} : ${data.msg} ❌`);
          }
        } catch (error) {
          console.log(error);
          alert("Something went wrong ❌");
        }
      }
      // submit handle
      document
        .querySelector("#formField")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.querySelector("#email").value;
          const password = document.querySelector("#password").value;
          const resText = document.querySelector("#resultText");
          if (isLogin) {
            if (password.trim() == "") {
              alert("Password cannot be empty");
              return;
            }
            handleAuth(
              "/auth/login",
              { email, password },
              "Login successful",
              "Login failed",
            );
          } else {
            const username = document.querySelector("#username").value;
            if (username.trim() == "") {
              alert("Name cannot be empty");
              return;
            } else if (password.trim() == "") {
              alert("Password cannot be empty");
              return;
            }
            handleAuth(
              "/auth/register",
              { username, email, password },
              "Registration successful",
              "Registration failed",
            );
          }
        });
    </script>
  </body>
</html>
